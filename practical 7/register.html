<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentSphere | Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
<header>
    <h1>StudentSphere</h1>
    <p>Your Complete Student Hub</p>
</header>
<section class="banner">
    <h2>Create Your Account</h2>
    <p>Register yourself to access the StudentSphere Dashboard.</p>
</section>
<section>
    <div class="register-box">
        <h2>Student Registration</h2>
        <form id="registerForm" action="process_registration.php" method="POST">
            <label>Full Name</label>
            <br><br>
            <input type="text" id="name" name="name" placeholder="Enter Full Name">
            <br><br>
            <label>Email Address</label>
            <br><br>
            <input type="email" id="email" name="email" placeholder="Enter Email">
            <br><br>
            <label>Password</label>
            <br><br>
            <input type="password" id="password" name="password" placeholder="Enter Password">
            <br><br>
            <label>Confirm Password</label>
            <br><br>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password">
            <br><br>
            <input type="submit" value="Register">
        </form>
        <br>
        <p style="text-align:center;">
            Already have an account?
            <a href="login.html">Login Here</a>
        </p>
    </div>
</section>
<footer>
    <p>© 2026 StudentSphere</p>
</footer>

<script src="register.js"></script>
<script src="theme.js"></script>
<script src="ad.js"></script>
</body>
</html>
